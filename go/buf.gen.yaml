version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rdeusser/tardigrade/go/api
inputs:
  - directory: proto
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: api
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: api
    opt: paths=source_relative
  - local: api/typescript/node_modules/.bin/protoc-gen-es
    out: api/typescript/src
    opt: target=ts
